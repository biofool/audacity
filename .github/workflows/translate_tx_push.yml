name: '[AU4] Translations: Push source strings to Transifex'

on:
  workflow_dispatch:
    inputs:
      retyped_branch_name:
        description: "Retype the current branch name to confirm you are on the correct branch"
        required: true

jobs:
  tx_push:
    runs-on: ubuntu-slim
    steps:
      - name: Check preconditions
        env:
          GITHUB_REF: ${{ github.ref }}
          RETYPED_BRANCH_NAME: ${{ inputs.retyped_branch_name }}
          TRANSIFEX_API_TOKEN: ${{ secrets.TRANSIFEX_API_TOKEN }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/${RETYPED_BRANCH_NAME}" ]; then
            echo "::error::Branch name does not match the current branch"
            exit 1
          fi
          if [ -z "$TRANSIFEX_API_TOKEN" ]; then
            echo "::error::TRANSIFEX_API_TOKEN is empty"
            exit 1
          fi

      - name: Clone repository
        uses: actions/checkout@v7

      - name: Push source strings to Transifex (tx push)
        uses: transifex/cli-action@v2
        with:
          token: ${{ secrets.TRANSIFEX_API_TOKEN }}
          args: "push -s"
